<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetAngie Style Online Photobooth</title>
  <!-- PeerJS untuk koneksi 2 HP -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background-color: #f4efe6;
      color: #4a3e3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    h1 { color: #5a4638; margin-bottom: 2px; font-size: 26px; }
    p.subtitle { color: #8c7a6b; margin-top: 0; margin-bottom: 20px; font-size: 14px; }

    /* Panel Koneksi Room Kode */
    .room-card {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e8dec8;
    }

    .code-box {
      font-size: 18px;
      font-weight: bold;
      background: #f0e6d2;
      padding: 8px 15px;
      border-radius: 8px;
      letter-spacing: 2px;
      color: #5a4638;
    }

    .join-group { display: flex; gap: 8px; }

    input[type="text"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d0c2b0;
      background: #faf7f2;
      color: #333;
      font-size: 14px;
      text-transform: uppercase;
      width: 130px;
      text-align: center;
    }

    button {
      background-color: #6b5344;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) { background-color: #523e31; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    /* Tampilan Split Screen Live Kamera */
    .viewfinders {
      position: relative;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid #e8dec8;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1/1; /* Rasio Persegi Presisi */
    }

    .video-container span.label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      z-index: 2;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.2) contrast(1.05) brightness(0.95); /* Filter Warm Vintage Sesuai Gambar */
    }

    #localVideo { transform: scaleX(-1); }

    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 100px;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: none;
      z-index: 10;
    }

    .action-panel {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Tampilan Preview Photo Strip di Layar */
    #stripCanvas {
      width: 240px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-top: 15px;
      display: none;
    }

    #downloadBtn { background-color: #8c7a6b; display: none; }
    #downloadBtn:hover { background-color: #6b5344; }
  </style>
</head>
<body>

  <h1>keke & DAVIN</h1>
  <p class="subtitle">our photobooth • getangie.com style</p>

  <!-- Panel Kode Room -->
  <div class="room-card">
    <div>
      <div style="font-size: 12px; color: #8c7a6b; margin-bottom: 4px;">Kode Room Kamu:</div>
      <div id="myCodeDisplay" class="code-box">CONNECTING...</div>
    </div>
    <div class="join-group">
      <input type="text" id="joinCodeInput" placeholder="KODE TEMAN" maxlength="6">
      <button id="joinBtn">Sambungkan</button>
    </div>
  </div>

  <!-- Area Dual Viewfinder Split Kiri-Kanan -->
  <div class="viewfinders">
    <div id="countdown">3</div>

    <!-- Kamera Kamu -->
    <div class="video-container">
      <span class="label">Kamu (Kiri)</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- Kamera Teman -->
    <div class="video-container">
      <span class="label" id="remoteLabel">Menunggu Teman...</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="action-panel">
    <button id="startBtn" class="primary-btn" disabled style="padding: 15px 40px; font-size: 16px;">Mulai Foto (4x)</button>
    
    <canvas id="stripCanvas"></canvas>
    <a id="downloadLink" download="our_photobooth.png">
      <button id="downloadBtn">Download Photo Strip HD</button>
    </a>
  </div>

  <script>
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const myCodeDisplay = document.getElementById('myCodeDisplay');
    const joinCodeInput = document.getElementById('joinCodeInput');
    const joinBtn = document.getElementById('joinBtn');
    const startBtn = document.getElementById('startBtn');
    const remoteLabel = document.getElementById('remoteLabel');
    const countdownEl = document.getElementById('countdown');
    const canvas = document.getElementById('stripCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const downloadLink = document.getElementById('downloadLink');

    let peer = null;
    let dataConnection = null;
    let localStream = null;
    let isConnected = false;

    // Kode Acak 6 Digit
    const myCode = Math.floor(100000 + Math.random() * 900000).toString();

    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1080 }, height: { ideal: 1080 }, facingMode: "user" }, 
          audio: false 
        });
        localVideo.srcObject = localStream;
        initPeer();
      } catch (err) {
        alert("Gagal mengaktifkan kamera: " + err.message);
      }
    }

    function initPeer() {
      peer = new Peer(myCode);

      peer.on('open', (id) => {
        myCodeDisplay.innerText = id;
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          setConnectedState();
        });
      });

      peer.on('connection', (conn) => {
        dataConnection = conn;
        setupDataListener();
      });
    }

    joinBtn.addEventListener('click', () => {
      const targetCode = joinCodeInput.value.trim();
      if (!targetCode || targetCode.length !== 6) {
        alert("Masukkan 6 digit kode room!");
        return;
      }

      const call = peer.call(targetCode, localStream);
      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        setConnectedState();
      });

      dataConnection = peer.connect(targetCode);
      setupDataListener();
    });

    function setConnectedState() {
      isConnected = true;
      remoteLabel.innerText = "Teman (Kanan)";
      remoteLabel.style.background = "#6b5344";
      startBtn.disabled = false;
      joinBtn.disabled = true;
      joinCodeInput.disabled = true;
    }

    function setupDataListener() {
      dataConnection.on('data', (data) => {
        if (data.type === 'START_COUNTDOWN') {
          triggerPhotoSequence();
        }
      });
    }

    startBtn.addEventListener('click', () => {
      if (!isConnected) return;
      if (dataConnection) {
        dataConnection.send({ type: 'START_COUNTDOWN' });
      }
      triggerPhotoSequence();
    });

    async function triggerPhotoSequence() {
      startBtn.disabled = true;
      canvas.style.display = 'none';
      downloadBtn.style.display = 'none';

      drawBlankHDCanvas();

      // Mengambil 4 Foto Sesuai Referensi Gambar (4 Baris Bertumpuk)
      for (let i = 0; i < 4; i++) {
        await runCountdown(3);
        captureDualPhoto(i);
      }

      startBtn.disabled = false;
      canvas.style.display = 'block';
      downloadLink.href = canvas.toDataURL('image/png', 1.0);
      downloadBtn.style.display = 'block';
    }

    function runCountdown(seconds) {
      return new Promise((resolve) => {
        countdownEl.style.display = 'block';
        let count = seconds;
        countdownEl.innerText = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(timer);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    // Menggambar Bingkai Sesuai Gaya Referensi Gambar
    function drawBlankHDCanvas() {
      canvas.width = 1200;  // Resolusi Tinggi HD
      canvas.height = 3100;

      // Warna Bingkai Krem Pastel
      ctx.fillStyle = "#f5ebd9"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Tanggal Otomatis di Bawah Strip (Format: YYYY.MM.DD)
      const now = new Date();
      const dateStr = now.getFullYear() + '.' + 
                      String(now.getMonth() + 1).padStart(2, '0') + '.' + 
                      String(now.getDate()).padStart(2, '0');

      ctx.fillStyle = "#6b5344";
      ctx.font = "bold 55px Arial";
      ctx.textAlign = "center";
      ctx.fillText(dateStr, canvas.width / 2, canvas.height - 100);
    }

    function captureDualPhoto(slotIndex) {
      const margin = 80;
      const gap = 15; // Berdempetan dekat sesuai gambar
      const startY = 100;
      const rowHeight = 520;

      const singleW = (canvas.width - (margin * 2) - gap) / 2; // 512px
      const singleH = rowHeight; // Square 1:1
      const currentY = startY + slotIndex * (rowHeight + 35);

      // Gambar Kamera Kiri
      drawVideoToCanvas(localVideo, margin, currentY, singleW, singleH, true);

      // Gambar Kamera Kanan
      drawVideoToCanvas(remoteVideo, margin + singleW + gap, currentY, singleW, singleH, false);
    }

    function drawVideoToCanvas(videoElem, targetX, targetY, targetW, targetH, isMirror) {
      const vW = videoElem.videoWidth || 640;
      const vH = videoElem.videoHeight || 480;

      // Crop Center Persegi (1:1)
      const targetRatio = targetW / targetH;
      const videoRatio = vW / vH;

      let sW, sH, sX, sY;
      if (videoRatio > targetRatio) {
        sH = vH;
        sW = vH * targetRatio;
        sX = (vW - sW) / 2;
        sY = 0;
      } else {
        sW = vW;
        sH = vW / targetRatio;
        sX = 0;
        sY = (vH - sH) / 2;
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(targetX, targetY, targetW, targetH);
      ctx.clip();

      // Tambahkan Filter Vintage Sepia pada Canvas
      ctx.filter = "sepia(0.25) contrast(1.05) brightness(0.95)";

      if (isMirror) {
        ctx.translate(targetX + targetW, targetY);
        ctx.scale(-1, 1);
        ctx.drawImage(videoElem, sX, sY, sW, sH, 0, 0, targetW, targetH);
      } else {
        ctx.drawImage(videoElem, sX, sY, sW, sH, targetX, targetY, targetW, targetH);
      }

      ctx.restore();
    }

    initCamera();
  </script>
</body>
</html>
